[package]
name = "configurator"
version = "0.1.0"
edition = "2024"

[dependencies]
zerocopy = { version = "0.8.24"}
common = {path="../common"}
egui = "0.36.0"
eframe = { version = "0.36.0" }
log = "0.4.27"
web-time = "1.1.0"
embedded-io-async = "0.6.1"
async-trait = "0.1.92"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
serialport = "4.9.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
wasm-bindgen ="0.2.130"
web-sys = {version="0.3.70", features=["Serial", "SerialOptions", "SerialPort", "SerialPortInfo", "ReadableStream", "WritableStream", "ReadableStreamDefaultReader", "ReadableStreamByobReader", "WritableStreamDefaultWriter", "ReadableStreamReadResult"] }

[profile.release]
lto = "thin"
opt-level = 3
